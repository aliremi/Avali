name: voice_text_app
description: "Voice to Text and Text to Voice App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  speech_to_text: ^6.6.1
  flutter_tts: ^3.8.5

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - icon.png
