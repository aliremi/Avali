name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Android project
        run: |
          flutter create --platforms=android .

      - name: Configure Android SDK
        run: |
          # Force compileSdk 36
          sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts

          # Add required permissions
          sed -i '/<manifest/a\
              <uses-permission android:name="android.permission.RECORD_AUDIO" />\
              <uses-permission android:name="android.permission.INTERNET" />' \
              android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: |
          flutter pub get

      - name: Show Flutter and Android configuration
        run: |
          flutter --version
          echo "----- build.gradle.kts -----"
          grep -n "compileSdk" android/app/build.gradle.kts
          echo "----- Android Manifest permissions -----"
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
