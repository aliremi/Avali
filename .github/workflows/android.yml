name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Build APK
      run: |
        flutter pub get
        flutter create --platforms=android .
        
        # اصلاح دقیق برای فایل های .kts جدید
        # تغییر compileSdk به 36 در فایل build.gradle.kts
        sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle.kts
        
        # اضافه کردن دسترسی‌ها
        sed -i '/<manifest/a \    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
        
        # بیلد نهایی
        flutter build apk --release --no-tree-shake-icons

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
